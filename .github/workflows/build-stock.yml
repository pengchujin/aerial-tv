name: Stock Build (Official Package)

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets must be routed through env before they can be used in `if:` conditions.
    env:
      AERIAL_KEYSTORE_BASE64: ${{ secrets.AERIAL_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Decode keystore
        id: decode_keystore
        if: ${{ env.AERIAL_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p local
          echo "$AERIAL_KEYSTORE_BASE64" | base64 -d > local/aerial-release.keystore
          echo "keystore_path=local/aerial-release.keystore" >> $GITHUB_OUTPUT

      - name: Create signing config
        if: ${{ env.AERIAL_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p local
          cat > local/signing.properties <<EOF
          storeFile=aerial-release.keystore
          storePassword=${{ secrets.AERIAL_STORE_PASSWORD }}
          keyAlias=${{ secrets.AERIAL_KEY_ALIAS }}
          keyPassword=${{ secrets.AERIAL_KEY_PASSWORD }}
          EOF
          cat local/signing.properties

      - name: Build Standard Release
        run: |
          ./gradlew :app:assembleStandardRelease \
            --no-daemon --stacktrace

      - name: Find APKs
        id: find_apks
        run: |
          STANDARD_APK=$(find app/build/outputs/apk -name "*standard*release*.apk" 2>/dev/null | head -1)
          echo "standard_apk=${STANDARD_APK}" >> $GITHUB_OUTPUT
          echo "Found standard: ${STANDARD_APK}"

      - name: Verify APK signature and package
        if: ${{ steps.find_apks.outputs.standard_apk != '' }}
        run: |
          apk="${{ steps.find_apks.outputs.standard_apk }}"
          echo "=== $apk ==="
          apksigner verify --print-certs "$apk" 2>&1 || true
          aapt dump badging "$apk" 2>&1 | grep -E "package:|application-label:|versionCode|versionName" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aerial-stock-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*release*.apk
          retention-days: 7
