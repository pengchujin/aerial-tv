<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Aerial</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000; --secondary: rgba(60,60,67,.6);
    --sep: rgba(60,60,67,.18); --segment: #fff; --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6);
      --sep: rgba(84,84,88,.6); --segment: #636366; --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));
    max-width: 720px; margin-inline: auto;
  }
  header { padding: 28px 4px 8px; position: relative; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--secondary); font-size: 15px; }
  .lang { position: absolute; top: 24px; right: 4px; max-width: 46%; appearance: auto; border: 0; border-radius: 999px; background: var(--fill); color: var(--tint); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 10px; cursor: pointer; }
  h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary); margin: 28px 4px 8px; }
  .group { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
  .segmented.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .video-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .video-row + .video-row { border-top: 1px solid var(--fill); }
  .video-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .video-row button { flex-shrink: 0; }
  .segmented.two { grid-template-columns: repeat(2, 1fr); }
  .segmented button {
    appearance: none; border: 0; background: transparent; color: var(--label); font: inherit; font-size: 15px; font-weight: 500;
    padding: 9px 0; border-radius: 8px; transition: background .2s ease, box-shadow .2s ease;
  }
  .segmented button[aria-pressed="true"] { background: var(--segment); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
  .segmented button:active { transform: scale(.97); }
  .hint { color: var(--secondary); font-size: 13px; margin: 8px 4px 0; }
  .upload {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 15px; border: 0; border-radius: 14px; background: var(--tint); color: #fff;
    font: inherit; font-weight: 600; transition: transform .16s ease-out, opacity .2s ease;
  }
  .upload:active { transform: scale(.98); }
  .upload[disabled] { opacity: .6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .wp { position: relative; border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: left; }
  .wp img, .wp .ph {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--fill);
    transition: transform .2s ease-out, box-shadow .2s ease;
  }
  .wp:active img { transform: scale(.97); }
  .wp .t { font-size: 14px; font-weight: 500; margin: 6px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp .c { font-size: 12px; color: var(--secondary); margin: 1px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp[aria-selected="true"] img { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--tint); }
  .check {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--tint); color: #fff; display: none; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .wp[aria-selected="true"] .check { display: flex; }
  .del {
    position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 15px; line-height: 26px; padding: 0;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .ren { left: auto; right: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px;
    opacity: 0; transition: opacity .2s ease, transform .3s cubic-bezier(.23,1,.32,1); pointer-events: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--secondary); font-size: 15px; padding: 4px; }
  .wx { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; }
  .wx b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  .wx span { color: var(--secondary); font-size: 15px; }
  .city { display: flex; gap: 8px; margin-top: 10px; }
  .city input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--label); background: var(--card);
    border: 0; border-radius: 10px; padding: 11px 12px; box-shadow: var(--shadow); outline: none;
  }
  .city input:focus { box-shadow: 0 0 0 2px var(--tint); }
  .city button {
    font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 10px; padding: 0 16px;
    background: var(--tint); color: #fff; transition: transform .16s ease-out, opacity .2s ease;
  }
  .city button:active { transform: scale(.97); }
  .city button[disabled] { opacity: .6; }
  .diag {
    display: block; width: 100%; height: 220px; margin-top: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;
    color: var(--label); background: var(--card); border: 0; border-radius: 12px; padding: 10px; box-shadow: var(--shadow);
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  /* A display rule would otherwise show what is hidden (the diagnostics box and its buttons). */
  [hidden] { display: none !important; }
  .row .upload { flex: 1; padding: 13px; }
  .row .upload.plain { background: var(--fill); color: var(--tint); text-decoration: none; }
  .link { appearance: none; border: 0; background: none; color: var(--tint); font: inherit; font-size: 13px; padding: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Aerial</h1>
  <p>{{DEVICE}} · <span data-i18n="personalize"></span></p>
  <select class="lang" id="lang" data-i18n-aria-label="language"></select>
</header>

<h2 data-i18n="screensaver"></h2>
<div class="segmented four" id="ss" role="group" data-i18n-aria-label="screensaver_short">
  <button data-mode="aerial" data-i18n="ss_aerial"></button>
  <button data-mode="photos" data-i18n="ss_photos"></button>
  <button data-mode="clock" data-i18n="ss_clock"></button>
  <button data-mode="videos" data-i18n="ss_videos"></button>
  <button data-mode="snoopy" data-i18n="ss_snoopy"></button>
</div>
<p class="hint" id="ssHint"></p>
<section id="videos" hidden>
  <h2 data-i18n="videos_h"></h2>
  <label class="upload" id="videoUploadBtn">
    <span id="videoUploadLabel" data-i18n="videos_upload"></span>
    <input id="videoFile" type="file" accept=".mp4,.mov,video/mp4,video/quicktime" multiple hidden>
  </label>
  <p class="hint" data-i18n="videos_hint"></p>
  <div id="videoList" class="group" style="margin-top: 12px"></div>
</section>

<h2 data-i18n="focus"></h2>
<div class="segmented two" id="focus" role="group" data-i18n-aria-label="focus">
  <button data-style="high_contrast" data-i18n="focus_high"></button>
  <button data-style="standard" data-i18n="focus_standard"></button>
</div>
<p class="hint" id="focusHint"></p>

<h2 data-i18n="weather"></h2>
<div class="group wx"><b id="wxNow">—</b><span id="wxPlace"></span></div>
<form class="city" id="cityForm">
  <input id="city" type="text" data-i18n-placeholder="city_ph" enterkeyhint="done" autocomplete="off">
  <button id="cityBtn" data-i18n="set"></button>
</form>
<p class="hint" id="wxHint"></p>

<h2 data-i18n="add_h"></h2>
<label class="upload" id="uploadBtn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
  <span id="uploadLabel" data-i18n="upload_label"></span>
  <input id="file" type="file" accept="image/*" multiple hidden>
</label>

<div id="sections"></div>

<h2 data-i18n="icons_h"></h2>
<p class="hint" style="margin-top:0;margin-bottom:12px" data-i18n="icons_hint"></p>
<div class="grid" id="apps"></div>
<input id="iconFile" type="file" accept="image/*" hidden>

<h2 data-i18n="feedback_h"></h2>
<p class="hint" style="margin-top:0;margin-bottom:12px" data-i18n="feedback_hint"></p>
<button class="upload" id="diagBtn" data-i18n="diag_show"></button>
<textarea class="diag" id="diag" readonly hidden></textarea>
<div class="row" id="diagActions" hidden>
  <button class="upload" id="diagCopy" data-i18n="diag_copy"></button>
  <a class="upload plain" href="https://github.com/pengchujin/aerial-tv/issues/new?template=device.yml" target="_blank" rel="noopener" data-i18n="diag_github"></a>
</div>
<div class="toast" id="toast"></div>

  b.innerHTML = `<img loading="lazy" alt="" src="${base}thumb/${encodeURIComponent(w.id)}${w.kind === 'snoopy' ? '?v=' + Number(state.snoopyReady) : ''}">
    <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <div class="t"></div><div class="c"></div>`;
  b.querySelector('.t').textContent = w.title;
  b.querySelector('.c').textContent = w.caption || '';
  b.onclick = async () => {
    state = await api('api/wallpaper', { id: w.id }); render(); toast(t('toast_wallpaper'));
  };
  if (w.kind === 'photo') {
    const d = document.createElement('button');
    d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', t('aria_delete'));
    d.onclick = async e => {
      e.stopPropagation();
      if (!confirm(t('confirm_delete'))) return;
      state = await api('api/delete', { id: w.id }); render();
    };
    b.appendChild(d);
  }
  return b;
}

const weatherNames = { clear: t('wx_clear'), partlycloudy: t('wx_partlycloudy'), cloudy: t('wx_cloudy'), fog: t('wx_fog'), rain: t('wx_rain'), snow: t('wx_snow'), thunder: t('wx_thunder') };

function renderWeather() {
  const w = state.weather || {};
  $('#wxNow').textContent = w.celsius !== undefined ? `${w.celsius}° ${weatherNames[w.kind] || ''}` : '—';
  $('#wxPlace').textContent = w.place || '';
  const hint = $('#wxHint'); hint.innerHTML = '';
  if (w.chosen) {
    hint.append(t('wx_chosen', { place: w.place }));
    const b = document.createElement('button'); b.className = 'link'; b.textContent = t('wx_auto_btn');
    b.onclick = async () => { state = await api('api/weather/auto', {}); render(); toast(t('toast_auto')); };
    hint.append(b);
  } else {
    hint.textContent = w.place
      ? t('wx_guessed', { place: w.place })
      : t('wx_none');
  }
}

let iconFor = null;
function renderApps() {
  const g = $('#apps'); g.innerHTML = '';
  for (const a of state.apps || []) {
    const b = document.createElement('button');
    b.className = 'wp';
    b.innerHTML = `<img loading="lazy" alt=""><div class="t"></div><div class="c"></div>`;
    b.querySelector('img').src = `${base}tile/${encodeURIComponent(a.key)}?v=${a.stamp}-${a.look || 0}`;
    b.querySelector('.t').textContent = a.label;
    b.querySelector('.c').textContent = a.source ? (a.label === a.port ? t('tag_source') : a.port) : a.custom ? t('tag_custom') : '';
    if (a.source) {
      const n = document.createElement('button');
      n.className = 'del ren'; n.textContent = '✎'; n.setAttribute('aria-label', t('aria_rename'));
      n.onclick = async e => {
        e.stopPropagation();
        const name = prompt(t('prompt_rename', { port: a.port }), a.name || '');
        if (name === null) return;
        try { state = await api('api/source/name', { app: a.key, name }); render(); toast(t(name.trim() ? 'toast_renamed' : 'toast_name_reset')); }
        catch (err) { toast(t('toast_rename_fail')); }
      };
      b.appendChild(n);
    }
    b.onclick = () => { iconFor = a; $('#iconFile').click(); };
    if (a.custom) {
      const r = document.createElement('button');
      r.className = 'del'; r.textContent = '↺'; r.setAttribute('aria-label', t('aria_reset_icon'));
      r.onclick = async e => {
        e.stopPropagation();
        if (!confirm(t('confirm_reset_icon', { label: a.label }))) return;
        state = await api('api/icon/reset', { app: a.key }); render(); toast(t('toast_icon_reset'));
      };
      b.appendChild(r);
    }
    g.appendChild(b);
  }
}

function renderVideos() {
  $('#videos').hidden = state.screensaver !== 'videos';
  const list = $('#videoList'); list.replaceChildren();
  const videos = state.videos || [];
  if (!videos.length) {
    const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('videos_empty'); list.appendChild(p);
  }
  for (const video of videos) {
    const row = document.createElement('div'); row.className = 'video-row';
    const name = document.createElement('span'); name.textContent = video.name; row.appendChild(name);
    const button = document.createElement('button'); button.className = 'link'; button.textContent = t('aria_delete');
    button.onclick = async () => {
      if (!confirm(t('confirm_video_delete', { name: video.name }))) return;
      button.disabled = true;
      try { state = await api('api/videos/delete', { id: video.id }); render(); }
      catch (err) { button.disabled = false; toast(t('toast_video_bad')); }
    };
    row.appendChild(button); list.appendChild(row);
  }
}

$('#videoFile').onchange = async e => {
  const input = e.target; const files = [...input.files]; if (!files.length) return;
  const btn = $('#videoUploadBtn'); const label = $('#videoUploadLabel');
  input.disabled = true; btn.setAttribute('disabled', '');
  let added = 0;
  for (const [i, file] of files.entries()) {
    label.textContent = t('sending_video', { n: i + 1, total: files.length });
    if (!file.size || file.size > 200 * 1024 * 1024) continue;
    try {
      const fd = new FormData(); fd.append('video', file, file.name);
      const r = await fetch(base + 'api/videos/upload', { method: 'POST', body: fd });
      if (!r.ok) throw new Error(r.status);
      state = await r.json(); if (state.saved) added++; render();
    } catch (err) { /* Keep going: a failed film should not discard the rest of the batch. */ }
  }
  input.disabled = false; input.value = ''; btn.removeAttribute('disabled'); label.textContent = t('videos_upload');
  toast(t('toast_videos_added', { n: added, failed: files.length - added }));
};

function render() {
  renderVideos();
  renderWeather();
  renderApps();
  document.querySelectorAll('#ss button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.mode === state.screensaver ? 'true' : 'false'));
  $('#ssHint').textContent = state.screensaverFollows
    ? t('hint_follows')
    : (hints[state.screensaver] || '');
  document.querySelectorAll('#focus button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.style === state.focusStyle ? 'true' : 'false'));
  $('#focusHint').textContent = state.focusStyle === 'standard'
    ? t('focus_hint_standard')
    : t('focus_hint_high');
  const root = $('#sections'); root.innerHTML = '';
  for (const [kind, title, sub] of groups) {
    let list = state.wallpapers.filter(w => w.kind === kind);
    if (kind === 'daily' && list.length) {
      list = [{ id: state.latestDaily, kind: 'daily', title: t('daily_title'), caption: t('daily_caption') }, ...list];
    }
    // Two or more photos: one a day, as on the TV (#27, #194).
    if (kind === 'photo' && list.length > 1) {
      list = [{ id: state.rotatePhotos, kind: 'photos', title: t('rotate_title'), caption: t('rotate_caption') }, ...list];
    }
    if (!list.length && kind !== 'photo') continue;
    const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
    if (!list.length) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('empty_photos'); root.appendChild(p);
      continue;
    }
    const g = document.createElement('div'); g.className = 'grid';
    list.forEach(w => g.appendChild(card(w, w.id === state.selected)));
    root.appendChild(g);
    if (kind === 'photo' && list.length === 1) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('add_second'); root.appendChild(p);
    }
  }
}

document.querySelectorAll('#ss button').forEach(b => b.onclick = async () => {
  state = await api('api/screensaver', { mode: b.dataset.mode }); render();
});
document.querySelectorAll('#focus button').forEach(b => b.onclick = async () => {
  state = await api('api/focus', { style: b.dataset.style }); render(); toast(t('toast_tv_updated'));
});

$('#file').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const btn = $('#uploadBtn'); const label = $('#uploadLabel');
  btn.setAttribute('disabled', ''); label.textContent = t('sending_n', { n: files.length });
  try {
    const fd = new FormData(); files.forEach((f, i) => fd.append('photo' + i, f, f.name));
    const r = await fetch(base + 'api/upload', { method: 'POST', body: fd });
    state = await r.json(); render();
    toast(state.added ? t('toast_added', { n: state.added }) : t('toast_no_photos'));
  } catch (err) { toast(t('toast_send_fail')); }
  btn.removeAttribute('disabled'); label.textContent = t('upload_label'); e.target.value = '';
};

$('#cityForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('#city').value.trim(); if (!name) return;
  const btn = $('#cityBtn'); btn.setAttribute('disabled', '');
  try {
    state = await api('api/weather/city', { name }); render();
    toast(state.found ? t('toast_city_set', { place: state.weather.place }) : t('toast_city_nf', { name }));
    if (state.found) $('#city').value = '';
  } catch (err) { toast(t('toast_set_fail')); }
  btn.removeAttribute('disabled');
};

$('#iconFile').onchange = async e => {
  const f = e.target.files[0]; const a = iconFor; e.target.value = '';
  if (!f || !a) return;
  toast(t('toast_sending_icon', { label: a.label }));
  try {
    const fd = new FormData(); fd.append('app', a.key); fd.append('picture', f, f.name);
    const r = await fetch(base + 'api/icon', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
    state = await r.json(); render();
    toast(t(state.saved ? 'toast_icon_set' : 'toast_icon_bad'));
  } catch (err) { toast(t('toast_send_fail')); }
};

$('#diagBtn').onclick = async () => {
  const b = $('#diagBtn'); b.disabled = true; b.textContent = t('diag_collecting');
  try {
    const r = await fetch(base + 'api/diagnostics');
    if (!r.ok) throw new Error(r.status);
    $('#diag').value = await r.text();
    $('#diag').hidden = false; $('#diagActions').hidden = false; b.hidden = true;
  } catch (e) { toast(t('toast_diag_fail')); b.textContent = t('diag_show'); }
  b.disabled = false;
};
// The page is plain HTTP on the LAN, where browsers offer no navigator.clipboard.
$('#diagCopy').onclick = () => {
  const t = $('#diag'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  toast(t(ok ? 'toast_copied' : 'toast_copy_manual'));
};

initLangSwitch();
applyI18n();
async function refresh() { try { state = await api('api/state'); render(); } catch (e) {} }
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 6000);
</script>
</body>
</html>
